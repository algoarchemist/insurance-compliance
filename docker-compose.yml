version: '3.9'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sugamai_db
      POSTGRES_USER: sugamai
      POSTGRES_PASSWORD: sugamai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sugamai
      MINIO_ROOT_PASSWORD: sugamai123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio

  celery:
    build: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file: .env
    depends_on:
      - redis
      - postgres

  celery-beat:
    build: ./backend
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    env_file: .env
    depends_on:
      - redis

  frontend-web:
    build: ./frontend-web
    command: npm run dev
    volumes:
      - ./frontend-web:/app
      - /app/node_modules
    env_file: .env
    environment:
      - WATCHPACK_POLLING=true
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
